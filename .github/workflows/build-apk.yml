name: Build PANCLUB Share Probe

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate probe app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/panclub/shareprobe

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'PANCLUBShareProbe'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.panclub.shareprobe'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.panclub.shareprobe'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="PANCLUB"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/panclub/shareprobe/MainActivity.java <<'EOF'
          package com.panclub.shareprobe;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private TextView out;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  out = new TextView(this);
                  out.setPadding(48, 72, 48, 48);
                  out.setTextSize(17);
                  out.setTextIsSelectable(true);
                  setContentView(out);
                  inspect(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  inspect(intent);
              }

              private void inspect(Intent intent) {
                  if (intent == null) return;

                  StringBuilder s = new StringBuilder();
                  s.append("PANCLUB Share Probe\n\n");
                  s.append("Pinterest → 공유 → PANCLUB\n\n");
                  s.append("ACTION\n").append(intent.getAction()).append("\n\n");
                  s.append("MIME\n").append(intent.getType()).append("\n\n");

                  Bundle extras = intent.getExtras();
                  s.append("EXTRAS\n");

                  if (extras == null || extras.isEmpty()) {
                      s.append("(없음)\n");
                  } else {
                      for (String key : extras.keySet()) {
                          try {
                              s.append(key).append("\n")
                               .append(String.valueOf(extras.get(key)))
                               .append("\n\n");
                          } catch (Exception e) {
                              s.append(key).append("\n<읽기 실패>\n\n");
                          }
                      }
                  }

                  ClipData clip = intent.getClipData();

                  s.append("\nCLIP DATA\n");

                  if (clip == null) {
                      s.append("(없음)\n");
                  } else {
                      for (int i = 0; i < clip.getItemCount(); i++) {
                          ClipData.Item item = clip.getItemAt(i);

                          s.append("item ").append(i).append("\n")
                           .append("text: ")
                           .append(String.valueOf(item.getText()))
                           .append("\n")
                           .append("uri: ")
                           .append(String.valueOf(item.getUri()))
                           .append("\n\n");
                      }
                  }

                  out.setText(s.toString());
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PANCLUB-Share-Probe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
